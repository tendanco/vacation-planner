<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планировщик отпусков</title>
<style>
  :root {
    --primary: #7c3aed;
    --primary-light: #ede9fe;
    --primary-dark: #5b21b6;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --success: #16a34a;
    --success-light: #dcfce7;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --bg: #f5f3ff;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-muted: #6b7280;
    --shadow: 0 2px 8px rgba(124,58,237,.08);
    --radius: 14px;
    --name-col: 320px;
    --ctrl-h: 30px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  .app-header {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #fff; padding: 16px 32px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 4px 16px rgba(124,58,237,.25); position: sticky; top: 0; z-index: 100;
    flex-wrap: wrap;
  }
  .app-header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; white-space: nowrap; flex: 1; }
  .header-actions { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

  .header-search {
    display: flex; align-items: center; gap: 6px;
    background: #fff; border: none;
    border-radius: 7px; padding: 0 10px;
    height: 28px; width: 200px; box-sizing: border-box;
    align-self: center;
  }
  .header-search svg { width: 15px !important; height: 15px !important; flex-shrink: 0; color: var(--primary); stroke: var(--primary); }
  .header-search input { font-size: .85rem !important; }
  .header-search input,
  .header-search input[type=text],
  .header-search input[type=text]:focus {
    border: none !important; background: none !important; outline: none !important; box-shadow: none !important;
    color: var(--text); font-size: .95rem; font-weight: 500; width: 100%;
    font-family: 'Segoe UI', sans-serif; height: 100%;
    -webkit-appearance: none; appearance: none; margin: 0; padding: 0;
  }
  .header-search input::placeholder { color: var(--text-muted); font-weight: 400; }

  .btn-header {
    background: rgba(255,255,255,.18); color: #fff; border: none; padding: 6px 11px;
    border-radius: 7px; cursor: pointer; font-size: .8rem; font-weight: 600;
    display: flex; align-items: center; gap: 5px; transition: background .2s;
    font-family: 'Segoe UI', sans-serif;
  }
  .btn-header .icon { width: 14px; height: 14px; }
  .btn-header:hover { background: rgba(255,255,255,.28); }
  .btn-header.admin-active { background: var(--success); }
  .btn-header.admin-active:hover { background: #15803d; }

  .req-badge {
    position: absolute; top: -6px; right: -6px;
    background: var(--danger); color: #fff;
    font-size: .72rem; font-weight: 700; line-height: 1;
    min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 9px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 2px var(--primary-dark);
  }
  .req-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 10px; background: #fafafa;
  }
  .req-item.past { opacity: .55; }
  .req-info { flex: 1; min-width: 0; }
  .req-info .req-name { font-weight: 700; color: var(--text); font-size: .95rem; }
  .req-info .req-meta { font-size: .82rem; color: var(--text-muted); margin-top: 3px; }
  .req-info .req-dept { display:inline-block; font-size:.75rem; background:var(--primary-light);
    color:var(--primary-dark); padding:2px 8px; border-radius:6px; margin-top:5px; font-weight:600; }
  .req-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .req-btn {
    border: none; border-radius: 8px; cursor: pointer; padding: 8px 12px;
    font-size: .85rem; font-weight: 600; display: flex; align-items: center; gap: 5px;
    font-family: 'Segoe UI', sans-serif;
  }
  .req-btn.approve { background: #16a34a; color: #fff; }
  .req-btn.reject  { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
  .req-empty { text-align: center; padding: 30px; color: var(--text-muted); }

  body:not(.is-admin) .admin-only { display: none !important; }

  .main { max-width: 1400px; margin: 0 auto; padding: 28px 20px; }

  .dept-block {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 20px;
    border: 1.5px solid var(--border); overflow: hidden; transition: box-shadow .2s;
  }
  .dept-block:hover { box-shadow: 0 4px 18px rgba(124,58,237,.13); }
  .dept-block.hidden-by-search { display: none; }
  .dept-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; cursor: pointer;
    background: linear-gradient(90deg, var(--primary-light), #f9f8ff);
    border-bottom: 1.5px solid var(--border); user-select: none;
  }
  .dept-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; flex: 1; }
  .dept-meta { font-size: .83rem; color: var(--text-muted); white-space: nowrap; }
  .dept-chevron { transition: transform .25s; flex-shrink: 0; color: var(--primary); }
  .dept-block.collapsed .dept-chevron { transform: rotate(-90deg); }
  .dept-body { display: block; }
  .dept-block.collapsed .dept-body { display: none; }
  .dept-controls { display: flex; align-items: center; gap: 2px; }
  .dept-ctrl-btn {
    background: none; border: none; cursor: pointer; padding: 5px 7px;
    border-radius: 7px; color: var(--text-muted); transition: background .15s, color .15s;
    display: flex; align-items: center;
  }
  .dept-ctrl-btn:hover { background: var(--primary-light); color: var(--primary); }
  .dept-del-btn:hover { background: var(--danger-light) !important; color: var(--danger) !important; }

  .move-btn {
    background: none; border: none; cursor: pointer; padding: 4px 5px;
    border-radius: 6px; color: var(--text-muted); transition: background .15s, color .15s;
    display: flex; align-items: center;
  }
  .move-btn:hover { background: var(--primary-light); color: var(--primary); }
  .move-btn:disabled { opacity: .3; cursor: default; pointer-events: none; }

  .card { padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .card:last-child { border-bottom: none; }
  .card h3 { font-size: .95rem; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; color: var(--primary-dark); }

  .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; align-items: end; }
  label { display: block; font-size: .82rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
  input[type=text], input[type=date], input[type=password], select {
    width: 100%; padding: 8px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: .93rem; background: #fafafa;
    transition: border-color .2s, box-shadow .2s; outline: none; font-family: 'Segoe UI', sans-serif;
  }
  input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,58,237,.1); background: #fff; }
  .add-vac-btn {
    background: var(--primary); color: #fff; border: none; padding: 8px 18px;
    border-radius: 8px; cursor: pointer; font-size: .93rem; white-space: nowrap;
    display: flex; align-items: center; gap: 6px; transition: background .2s; font-family: 'Segoe UI', sans-serif;
  }
  .add-vac-btn:hover { background: var(--primary-dark); }
  .add-emp-card { opacity: .6; transition: opacity .2s; }
  .add-emp-card:hover,
  .add-emp-card:focus-within { opacity: 1; }
  .add-emp-card input[type=text],
  .add-emp-card input[type=date] {
    height: 30px; padding: 0 10px; font-size: .88rem;
  }
  .add-emp-card .dp-field input[readonly] { height: 30px; padding: 0 10px; font-size: .88rem; }
  .add-emp-card .add-vac-btn { height: 30px; padding: 0 16px; font-size: .88rem; }

  .past-toggle-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 5px 12px; cursor: pointer; font-size: .82rem; color: var(--text-muted);
    font-family: 'Segoe UI', sans-serif; transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .past-toggle-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
  .past-toggle-btn.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

  .past-toggle-sm {
    height: var(--ctrl-h); padding: 0 12px; font-size: .8rem;
    color: var(--text-muted); border-color: var(--border); background: none; opacity: .8;
  }
  .past-toggle-sm .icon-sm { width: 13px; height: 13px; }
  .past-toggle-sm:hover { opacity: 1; background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
  .past-toggle-sm.active { opacity: 1; }

  .year-toggle-group {
    display: inline-flex; align-items: stretch; gap: 8px; flex-shrink: 0; margin-left: auto;
  }
  .year-select {
    width: auto !important; min-width: 0; height: var(--ctrl-h);
    padding: 0 8px !important; border-radius: 8px; border: 1.5px solid var(--border);
    font-size: .85rem; background: #fafafa; line-height: 1.2;
  }
  .year-toggle-group .past-toggle-sm { align-self: stretch; }

  .timeline-wrap { overflow-x: auto; border-radius: 10px; border: 1.5px solid var(--border); }
  .gantt { width: 100%; min-width: 0; table-layout: fixed; }
  .gantt-header { display: flex; background: var(--primary-light); border-bottom: 1.5px solid var(--border); }
  .gantt-name-col {
    width: var(--name-col); min-width: var(--name-col); flex-shrink: 0;
    padding: 8px 14px; font-weight: 600; font-size: .83rem; color: var(--primary-dark);
    border-right: 1.5px solid #ddd6fe;
  }
  .gantt-months { flex: 1; min-width: 0; display: flex; position: relative; overflow: hidden; }
  .gantt-month {
    position: absolute; text-align: center;
    font-size: .73rem; font-weight: 600; color: var(--primary-dark);
    padding: 8px 2px; border-left: 1px solid #ddd6fe; overflow: hidden;
  }

  .gantt-row { display: flex; border-bottom: 1px solid #f3f0ff; min-width: 0; }
  .gantt-row:last-child { border-bottom: none; }

  .gantt-name {
    width: var(--name-col); min-width: var(--name-col); flex-shrink: 0;
    padding: 7px 12px; font-size: .84rem; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
    border-right: 1px solid #f3f0ff; overflow: hidden;
  }
  .gantt-name-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gantt-name .emp-actions {
    display: flex; gap: 2px; margin-left: 4px; opacity: 0; transition: opacity .15s; flex-shrink: 0;
  }
  .gantt-row:hover .emp-actions { opacity: 1; }

  .emp-days {
    font-size: .7rem; font-weight: 700; color: var(--primary);
    background: var(--primary-light); padding: 1px 6px; border-radius: 10px; flex-shrink: 0;
  }
  .cmp-chk { width: 14px; height: 14px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }

  .gantt-track { flex: 1; min-width: 0; position: relative; height: 38px; overflow: hidden; }
  .gantt-bar {
    position: absolute; top: 7px; height: 24px;
    background: linear-gradient(90deg, #7c3aed, #a855f7);
    border-radius: 6px; cursor: pointer; transition: filter .2s; z-index: 2;
    box-shadow: 0 2px 6px rgba(124,58,237,.2); overflow: hidden;
    display: flex; align-items: center; padding: 0 6px;
    font-size: .67rem; color: #fff; font-weight: 600; white-space: nowrap;
  }
  .gantt-bar:hover { filter: brightness(1.1); }
  .gantt-bar.past-bar { background: linear-gradient(90deg, #9ca3af, #d1d5db); box-shadow: 0 2px 4px rgba(0,0,0,.1); }
  .gantt-overlap-seg {
    position: absolute; top: 7px; height: 24px; background: linear-gradient(90deg, #d97706, #f59e0b);
    border-radius: 6px; cursor: pointer; z-index: 2; box-shadow: 0 2px 6px rgba(217,119,6,.2); overflow: hidden;
    display: flex; align-items: center; padding: 0 6px;
    font-size: .67rem; color: #fff; font-weight: 600; white-space: nowrap;
  }
  .gantt-overlap-seg:hover { filter: brightness(1.1); }
  .gantt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: #c76a9a; z-index: 3; }
  .gantt-grid  { position: absolute; top: 0; bottom: 0; width: 1px; background: #ede9fe; z-index: 1; }
  .gantt-weekend { position: absolute; top: 0; bottom: 0; background: rgba(239,234,251,.5); z-index: 0; }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 18px; font-size: .68rem; color: var(--text-muted); align-items: center; }
  .legend .box { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: middle; }
  .scroll-hint { font-size: .77rem; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }

  .empty { text-align: center; padding: 28px; color: var(--text-muted); font-size: .93rem; }

  .compare-global {
    background: #ffffff; border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(124,58,237,.22);
    border: 2.5px solid var(--primary); margin-top: 28px; overflow: hidden;
  }
  .compare-global .card { border-bottom: none; background: transparent; }
  .compare-global h3 { color: var(--primary-dark); font-size: 1.05rem; }
  .compare-global .timeline-wrap { background: #fff; }

  .mini-btn {
    background: none; border: none; cursor: pointer; padding: 3px 4px; border-radius: 5px;
    display: flex; color: var(--text-muted); transition: background .15s, color .15s;
  }
  .mini-btn.add:hover    { background: var(--success-light); color: var(--success); }
  .mini-btn.rename:hover { background: var(--primary-light); color: var(--primary); }
  .mini-btn.del:hover    { background: var(--danger-light);  color: var(--danger); }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(2px);
  }
  .modal {
    background: #fff; border-radius: 16px; padding: 26px 28px; width: 100%; max-width: 420px;
    box-shadow: 0 8px 40px rgba(0,0,0,.15); position: relative; animation: popIn .2s;
    overflow: visible;
  }
  @keyframes popIn { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 { font-size: 1.05rem; margin-bottom: 16px; color: var(--primary-dark); }
  .modal label { font-size: .83rem; color: var(--text-muted); display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal-name { font-weight: 700; color: var(--primary-dark); }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; align-items: center; }
  .btn-primary { background: var(--primary); color: #fff; border: none; padding: 8px 20px; border-radius: 9px; cursor: pointer; font-size: .93rem; font-weight: 600; transition: background .2s; font-family: 'Segoe UI', sans-serif; display:flex; align-items:center; gap:6px; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #f3f4f6; color: var(--text); border: none; padding: 8px 16px; border-radius: 9px; cursor: pointer; font-size: .93rem; font-family: 'Segoe UI', sans-serif; }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger-modal { background: var(--danger-light); color: var(--danger); border: none; padding: 8px 14px; border-radius: 9px; cursor: pointer; font-size: .88rem; display: flex; align-items: center; gap: 5px; margin-right: auto; font-family: 'Segoe UI', sans-serif; }
  .btn-danger-modal:hover { background: #fecaca; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .info-item { background: #faf8ff; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 13px; }
  .info-item.full { grid-column: 1 / -1; }
  .info-label { font-size: .76rem; color: var(--text-muted); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
  .info-value { font-size: 1rem; font-weight: 700; color: var(--primary-dark); }
  .status { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: .8rem; font-weight: 600; }
  .status.active   { background: var(--success-light); color: var(--success); }
  .status.upcoming { background: var(--primary-light);  color: var(--primary); }
  .status.past     { background: var(--border); color: var(--text-muted); }
  .info-overlap { background: var(--warning-light); color: var(--warning); }
  .info-ok { background: var(--success-light); color: var(--success); }

  .icon { width: 16px; height: 16px; flex-shrink: 0; }
  .icon-sm { width: 14px; height: 14px; }

  .status-line {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1.5px solid var(--border); padding: 12px 14px; margin-top: 12px;
    font-size: .82rem; width: 280px; box-sizing: border-box;
  }
  .sl-row { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .sl-row + .sl-row { border-top: 1px solid var(--border); padding-top: 10px; }
  .sl-chips { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .sl-chip {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    padding: 5px 10px; border-radius: 10px; cursor: pointer;
    transition: transform .12s, box-shadow .12s; width: 100%; box-sizing: border-box;
  }
  .sl-chip:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .sl-chip.now  { background: var(--success-light); color: var(--success); }
  .sl-chip.soon { background: var(--primary-light); color: var(--primary-dark); }
  .sl-chip .sl-name { font-weight: 600; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sl-chip .sl-meta { font-size: .72rem; opacity: .8; }
  .sl-empty { color: var(--text-muted); font-style: italic; }

  /* ── Раскладка с боковым виджетом ── */
  .layout { max-width: 1500px; margin: 0 auto; padding: 28px 20px;
    display: grid; grid-template-columns: 280px minmax(0,1fr); gap: 16px; align-items: start; }
  .cal-widget { width: 100%; }
  .status-line { width: 100% !important; }
  .sidebar { position: sticky; top: 90px; width: 280px; }
  .layout > .main { max-width: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }

  /* ── Мини-календарь ── */
  .cal-widget { background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1.5px solid var(--border);
    padding: 16px; box-sizing: border-box; position: relative; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-weight: 700; font-size: .98rem; color: var(--primary-dark);
    display: flex; align-items: center; gap: 6px; text-transform: capitalize; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-nav button { background: none; border: 1.5px solid var(--border); border-radius: 7px;
    width: 28px; height: 28px; cursor: pointer; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; transition: .15s; }
  .cal-nav button:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; width: 100%; }
  .cal-grid > * { min-width: 0; box-sizing: border-box; }
  .cal-cell {
    height: 30px; display: flex; align-items: center; justify-content: center;
    font-size: .78rem; border-radius: 7px; cursor: default; color: var(--text);
    transition: .12s; overflow: hidden; padding: 0;
  }
  .cal-dow {
    height: 22px; display: flex; align-items: center; justify-content: center;
    font-size: .68rem; font-weight: 700; color: var(--text-muted); padding: 0;
  }
  .cal-dow.we { color: var(--danger); }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.we { color: var(--danger); }
  .cal-cell.has-vac { cursor: pointer; font-weight: 600; color: var(--primary-dark); background: #ddd6fe; }
  .cal-cell.has-vac.lite { color: var(--primary-dark); background: #ede9fe; }
  .cal-cell.has-vac.heavy { color: #fff; background: #a78bfa; }
  .cal-cell.has-vac:hover { filter: brightness(.97); box-shadow: 0 2px 6px rgba(124,58,237,.18); }
  .cal-cell.today { outline: 2px solid #c76a9a; outline-offset: -2px; }
  .cal-legend { margin-top: 12px; font-size: .72rem; color: var(--text-muted);
    display: flex; flex-direction: column; gap: 4px; }
  .cal-legend .row { display: flex; align-items: center; gap: 6px; }
  .cal-legend .sw { width: 14px; height: 10px; border-radius: 3px; }

  .cal-pop { position: absolute; z-index: 500; background: #fff;
    border: 1.5px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 12px 14px;
    width: 250px; display: none; }
  .cal-pop.open { display: block; animation: popIn .15s; }
  .cal-pop h4 { font-size: .85rem; color: var(--primary-dark); margin-bottom: 8px; }
  .cal-pop .p-item { display: flex; align-items: center; gap: 7px;
    padding: 5px 6px; border-radius: 7px; cursor: pointer; font-size: .82rem; }
  .cal-pop .p-item:hover { background: var(--primary-light); }
  .cal-pop .p-dept { font-size: .72rem; color: var(--text-muted); margin-left: auto; }

  /* ══════════ КАСТОМНЫЙ DATE-PICKER ══════════ */
  .dp-field { position: relative; }
  .dp-field input[readonly] { cursor: pointer; background: #fafafa; }
  .dp-field input[readonly]:hover { border-color: var(--primary); }
  .dp-field .dp-ico {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--primary); pointer-events: none;
  }

  .dp-pop {
    position: absolute; z-index: 3000; top: calc(100% + 6px); left: 0;
    background: #fff; border: 1.5px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(124,58,237,.25); padding: 14px;
    width: 280px; display: none; animation: popIn .15s;
  }
  .dp-pop.open { display: block; }
  .dp-pop.up { top: auto; bottom: calc(100% + 6px); }

  .dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .dp-head .dp-my {
    font-weight: 700; font-size: .95rem; color: var(--primary-dark);
    display: flex; gap: 6px; align-items: center; position: relative;
  }
  .dp-head .dp-my button {
    background: none; border: none; cursor: pointer; font: inherit; font-weight: 700;
    color: var(--primary-dark); padding: 3px 6px; border-radius: 6px; transition: .15s;
  }
  .dp-head .dp-my button:hover { background: var(--primary-light); }
  .dp-nav { display: flex; gap: 4px; }
  .dp-nav button {
    background: none; border: 1.5px solid var(--border); border-radius: 7px;
    width: 28px; height: 28px; cursor: pointer; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; transition: .15s;
  }
  .dp-nav button:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

  .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .dp-dow { height: 24px; display: flex; align-items: center; justify-content: center;
    font-size: .68rem; font-weight: 700; color: var(--text-muted); }
  .dp-dow.we { color: var(--danger); }
  .dp-day {
    height: 32px; display: flex; align-items: center; justify-content: center;
    font-size: .82rem; border-radius: 8px; cursor: pointer; transition: .12s;
    color: var(--text); border: 1.5px solid transparent;
  }
  .dp-day:hover { background: var(--primary-light); color: var(--primary-dark); }
  .dp-day.other { color: #cbcbd4; }
  .dp-day.we { color: var(--danger); }
  .dp-day.today { border-color: #c76a9a; }
  .dp-day.selected { background: linear-gradient(135deg, var(--primary), #a855f7); color: #fff; font-weight: 700; }
  .dp-day.selected:hover { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); }
  .dp-day.disabled { opacity: .3; cursor: default; pointer-events: none; }

  .dp-foot { display: flex; justify-content: space-between; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--border); }
  .dp-foot button {
    background: none; border: none; cursor: pointer; font-size: .8rem; font-weight: 600;
    color: var(--primary); padding: 4px 10px; border-radius: 7px; transition: .15s;
    font-family: 'Segoe UI', sans-serif;
  }
  .dp-foot button:hover { background: var(--primary-light); }
  .dp-foot .dp-clear { color: var(--text-muted); }

  .dp-select-pop {
    position: absolute; z-index: 10; background: #fff; border: 1.5px solid var(--border);
    border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 8px;
    max-height: 200px; overflow-y: auto; display: none; top: 30px; left: 0;
  }
  .dp-select-pop.open { display: grid; }
  .dp-select-pop.months { grid-template-columns: repeat(3, 1fr); gap: 4px; width: 200px; }
  .dp-select-pop.years  { grid-template-columns: repeat(3, 1fr); gap: 4px; width: 180px; }
  .dp-select-pop button {
    background: none; border: none; cursor: pointer; padding: 7px 4px; border-radius: 6px;
    font-size: .8rem; color: var(--text); transition: .12s; font-family: 'Segoe UI', sans-serif;
  }
  .dp-select-pop button:hover { background: var(--primary-light); color: var(--primary); }
  .dp-select-pop button.active { background: var(--primary); color: #fff; font-weight: 700; }

  @media (max-width: 980px) {
    .layout  { grid-template-columns: 1fr; }
    .sidebar { position: static; width: 100%; }
  }
  @media (max-width: 800px) {
    :root { --name-col: 160px; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .app-header { padding: 12px 14px; }
    .main { padding: 14px 8px; }
    .app-header h1 { flex: 1 1 100%; }
    .header-actions { flex: 1 1 100%; }
    .header-search { flex: 1; width: auto; }
    .status-line { font-size: .8rem; padding: 10px 12px; }
  }
</style>

function parseD(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtD(dt) { return dt.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000) + 1; }
function todayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;

function esc(s)  { return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function attr(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function normalizeName(s) { return String(s).replace(/\s+/g, ' ').replace(/\s*\.\s*/g, '. ').trim(); }
function nameKey(s) { return normalizeName(s).toLowerCase().replace(/\s+/g, ''); }
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}
function existingNames(deptId = null) {
  const list = deptId ? vacations.filter(v => v.dept === deptId) : vacations;
  const map = new Map();
  list.forEach(v => { if (!map.has(nameKey(v.name))) map.set(nameKey(v.name), v.name); });
  return [...map.values()].sort((a,b) => a.localeCompare(b,'ru'));
}
function resolveEmployee(input, deptId) {
  const norm = normalizeName(input);
  const key  = nameKey(norm);
  const names = existingNames(deptId);
  const exact = names.find(n => nameKey(n) === key);
  if (exact) return { status: 'exact', name: exact };
  let best = null, bestDist = Infinity;
  names.forEach(n => { const d = levenshtein(nameKey(n), key); if (d < bestDist) { bestDist = d; best = n; } });
  if (best && bestDist <= 2 && key.length >= 4) return { status: 'similar', name: best, input: norm };
  return { status: 'new', name: norm };
}

function calcOverlaps(vacs) {
  const overlaps = {}, overlapWith = {};
  for (let i = 0; i < vacs.length; i++) {
    for (let j = i+1; j < vacs.length; j++) {
      const a = vacs[i], b = vacs[j];
      if (a.name === b.name) continue;
      const as = parseD(a.start), ae = parseD(a.end);
      const bs = parseD(b.start), be = parseD(b.end);
      if (as <= be && bs <= ae) {
        const os = new Date(Math.max(as,bs)), oe = new Date(Math.min(ae,be));
        const days = Math.round((oe-os)/86400000)+1;
        overlaps[a.id] = overlaps[b.id] = true;
        (overlapWith[a.id] = overlapWith[a.id]||[]).push({name:b.name, days});
        (overlapWith[b.id] = overlapWith[b.id]||[]).push({name:a.name, days});
      }
    }
  }
  return {overlaps, overlapWith};
}
function calcRange(year, deptVacsYear, hidePast) {
  const today = todayStr();
  const yearStart = new Date(year, 0, 1);
  const yearEnd   = new Date(year, 11, 31);
  if (!hidePast) return { rangeStart: yearStart, rangeEnd: yearEnd };
  const future = deptVacsYear.filter(v => v.end >= today);
  if (!future.length) return { rangeStart: yearStart, rangeEnd: yearEnd };
  const todayDt = parseD(today);
  let minStart = todayDt, maxEnd = yearEnd;
  future.forEach(v => {
    const s = parseD(v.start), e = parseD(v.end);
    if (s < minStart) minStart = s;
    if (e > maxEnd)   maxEnd   = e;
  });
  if (minStart < yearStart) minStart = yearStart;
  if (maxEnd   > yearEnd)   maxEnd   = yearEnd;
  const scaleStart = todayDt < yearStart ? yearStart : todayDt;
  return { rangeStart: scaleStart, rangeEnd: maxEnd };
}

async function submitRequest() {
  const empSel  = document.getElementById('reqEmpSel');
  const rawName = (empSel && empSel.value !== '__new__') ? empSel.value : document.getElementById('reqName').value;
  const dept    = document.getElementById('reqDept').value;
  const start   = document.getElementById('reqStart').value;
  const end     = document.getElementById('reqEnd').value;
  if (!rawName.trim()) { alert('Введите ФИО сотрудника'); return; }
  if (!dept)  { alert('Выберите отдел'); return; }
  if (!start) { alert('Укажите дату начала'); return; }
  if (!end)   { alert('Укажите дату окончания'); return; }
  if (end < start) { alert('Дата окончания не может быть раньше даты начала'); return; }
  const res = resolveEmployee(rawName, dept);
  let finalName = res.name;
  if (res.status === 'similar') {
    const ok = confirm(`В этом отделе есть сотрудник «${res.name}».\nВы ввели «${res.input}».\n\nОК — отправить от имени «${res.name}».\nОтмена — оставить «${res.input}».`);
    finalName = ok ? res.name : res.input;
  }
  await addDoc(reqsRef, { name: finalName, dept, start, end, createdAt: serverTimestamp() });
  closeRequestModal();
  alert('Запрос отправлен администратору на согласование.');
}

async function approveRequest(reqId) {
  if (!requireAdmin()) return;
  const r = requests.find(x => x.id === reqId);
  if (!r) return;
  const dep = departments.find(d => d.id === r.dept);
  if (!dep) { alert('Отдел этого запроса был удалён. Одобрение невозможно.'); return; }
  const batch = writeBatch(db);
  batch.set(doc(collection(db,'vacations')), { name: r.name, start: r.start, end: r.end, dept: r.dept });
  batch.delete(doc(db,'requests', reqId));
  await batch.commit();
  renderRequestsList();
}

function renderStatusBar() {

  soonLimit.setDate(soonLimit.getDate() + 7);
  const deptName = id => (departments.find(d => d.id === id)?.name || '');
  const diffDays = dateStr => Math.round((parseD(dateStr) - todayDt) / 86400000);
  const nowList = vacations.filter(v => v.start <= today && v.end >= today).sort((a,b) => a.end.localeCompare(b.end));
  const soonList = vacations.filter(v => v.start > today && parseD(v.start) <= soonLimit).sort((a,b) => a.start.localeCompare(b.start));
  const nowChips = nowList.length ? nowList.map(v => {
      const left = diffDays(v.end);
      const meta = left === 0 ? 'посл. день' : `ещё ${left} дн.`;
      return `<span class="sl-chip now" onclick="showInfo('${v.id}')" title="${esc(deptName(v.dept))}"><span class="sl-name">${esc(v.name)}</span><span class="sl-meta">${meta}</span></span>`;
    }).join('') : `<span class="sl-empty">никого</span>`;
  const soonChips = soonList.length ? soonList.map(v => {
      const inD = diffDays(v.start);
      const meta = inD === 0 ? 'сегодня' : (inD === 1 ? 'завтра' : `через ${inD} дн.`);
      return `<span class="sl-chip soon" onclick="showInfo('${v.id}')" title="${esc(deptName(v.dept))}"><span class="sl-name">${esc(v.name)}</span><span class="sl-meta">${meta}</span></span>`;
    }).join('') : `<span class="sl-empty">никого в ближайшие 7 дней</span>`;
  cont.innerHTML = `<div class="status-line">
      <div class="sl-row"><span class="sl-label now"><svg class="icon-sm"><use href="#i-user"/></svg> Сейчас в отпуске:</span><div class="sl-chips">${nowChips}</div></div>
      <div class="sl-row"><span class="sl-label soon"><svg class="icon-sm"><use href="#i-clock"/></svg> Скоро:</span><div class="sl-chips">${soonChips}</div></div>
    </div>`;
}

const CAL_MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const CAL_DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function vacsOnDate(dateStr) { return vacations.filter(v => v.start <= dateStr && v.end >= dateStr); }
function renderCalendar() {
  const grid = document.getElementById('calGrid');
  const titleEl = document.querySelector('#calTitle span');
  if (!grid || !titleEl) return;
  closeCalPop();
  const y = calView.getFullYear(), m = calView.getMonth();
  titleEl.textContent = `${CAL_MONTHS[m]} ${y}`;
  let html = CAL_DOW.map((d,i) => `<div class="cal-dow ${i>=5?'we':''}">${d}</div>`).join('');
  const first = new Date(y, m, 1);
  let startDow = first.getDay(); startDow = startDow === 0 ? 6 : startDow - 1;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = todayStr();
  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(y, m, d).getDay();
    const we  = (dow === 0 || dow === 6);
    const cnt = vacsOnDate(ds).length;
    let cls = 'cal-cell';
    if (we) cls += ' we';
    if (ds === today) cls += ' today';
    if (cnt > 0) { cls += ' has-vac'; if (cnt >= 4) cls += ' heavy'; else if (cnt === 1) cls += ' lite'; }
    const onclick = cnt > 0 ? `onclick="openCalPop('${ds}',this)"` : '';
    html += `<div class="${cls}" ${onclick}>${d}</div>`;
  }
  grid.innerHTML = html;
}
function openCalPop(dateStr, cell) {
  const pop = document.getElementById('calPop');
  if (!pop) return;
  const list = vacsOnDate(dateStr).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  pop.innerHTML = `<h4>${fmtD(parseD(dateStr))} · ${list.length} в отпуске</h4>` +
    list.map(v => `<div class="p-item" onclick="showInfo('${v.id}');closeCalPop();"><svg class="icon-sm" style="color:var(--primary)"><use href="#i-user"/></svg><span>${esc(v.name)}</span></div>`).join('');
  const widget = pop.closest('.cal-widget');
  const wRect = widget.getBoundingClientRect();
  const cRect = cell.getBoundingClientRect();
  let top = cRect.bottom - wRect.top + 6;
  let left = cRect.left - wRect.left;
  if (left + 250 > widget.offsetWidth) left = widget.offsetWidth - 250 - 4;
  if (left < 0) left = 0;
  pop.style.top = top + 'px'; pop.style.left = left + 'px';
  pop.classList.add('open');
  setTimeout(() => document.addEventListener('click', calPopOutside, true), 50);
}
window.openCalPop = openCalPop;
function calPopOutside(e) {
  const pop = document.getElementById('calPop');
  if (!pop) return;
  if (pop.contains(e.target) || e.target.closest('.cal-cell')) return;
  closeCalPop();
}
function closeCalPop() {
  const pop = document.getElementById('calPop');
  if (pop) pop.classList.remove('open');
  document.removeEventListener('click', calPopOutside, true);
}
window.closeCalPop = closeCalPop;

function renderDept(dep, idx) {
  const year     = ganttYear[dep.id] || new Date().getFullYear();
  const hidePast = hidePastDepts.has(dep.id);
  const today    = todayStr();
  const deptVacs = vacations.filter(v => v.dept === dep.id);
  const deptVacsYear = deptVacs.filter(v => {
    const sy = parseInt(v.start.split('-')[0]);
    const ey = parseInt(v.end.split('-')[0]);
    return sy === year || ey === year;
  });
  const employees = [...new Set(deptVacsYear.map(v => v.name))].sort((a,b) => a.localeCompare(b,'ru'));
  const collapsed = collapsedDepts.has(dep.id);
  const { rangeStart, rangeEnd } = calcRange(year, deptVacsYear, hidePast);
  const totalDays = Math.round((rangeEnd - rangeStart) / 86400000) + 1;
  const dayPct    = 100 / totalDays;
  function dayOf(dt) { return Math.round((dt - rangeStart) / 86400000); }
  const MONTHS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  let monthHeader = '';
  for (let m = 0; m < 12; m++) {
    const md = new Date(year, m, 1), mde = new Date(year, m+1, 0);
    if (mde < rangeStart || md > rangeEnd) continue;
    const visStart = md < rangeStart ? rangeStart : md;
    const visEnd   = mde > rangeEnd  ? rangeEnd   : mde;
    const left  = dayOf(visStart) * dayPct;
    const width = (Math.round((visEnd - visStart) / 86400000) + 1) * dayPct;
    monthHeader += `<div class="gantt-month" style="left:${left}%;width:${width}%">${MONTHS[m]}</div>`;
  }
  let gridBg = '';
  for (let m = 0; m < 12; m++) {
    const md = new Date(year, m, 1);
    if (md <= rangeStart || md > rangeEnd) continue;
    gridBg += `<div class="gantt-grid" style="left:${dayOf(md)*dayPct}%"></div>`;
  }
  for (let d = 0; d < totalDays; d++) {
    const dt = new Date(rangeStart.getTime()); dt.setDate(dt.getDate()+d);
    const wd = dt.getDay();
    if (wd === 0 || wd === 6) gridBg += `<div class="gantt-weekend" style="left:${d*dayPct}%;width:${dayPct}%"></div>`;
  }
  const todayDt = new Date(); todayDt.setHours(0,0,0,0);
  let todayLine = '';
  if (todayDt >= rangeStart && todayDt <= rangeEnd) todayLine = `<div class="gantt-today" style="left:${dayOf(todayDt)*dayPct}%"></div>`;
  const {overlaps, overlapWith} = calcOverlaps(deptVacsYear);
  const years = [...new Set(deptVacs.flatMap(v => {
    const arr = [];
    for (let y = parseInt(v.start.split('-')[0]); y <= parseInt(v.end.split('-')[0]); y++) arr.push(y);
    return arr;
  }))].sort();
  if (!years.includes(year)) years.push(year);
  years.sort();
  let rows = '';
  employees.forEach(name => {
    const empVacs = deptVacsYear.filter(v => v.name === name);
    const visVacs = hidePast ? empVacs.filter(v => v.end >= today) : empVacs;
    if (hidePast && visVacs.length === 0) return;
    const totalDaysEmp = empVacs.reduce((s,v) => s + daysBetween(v.start, v.end), 0);
    const isInCompare  = compareSelected.has(cmpKey(dep.id, name));
    const nA = attr(name);
    let bars = '';
    empVacs.forEach(v => {
      if (hidePast && v.end < today) return;
      let s = parseD(v.start), e = parseD(v.end);
      if (s < rangeStart) s = rangeStart;
      if (e > rangeEnd)   e = rangeEnd;
      if (s > rangeEnd || e < rangeStart) return;
      const left  = dayOf(s) * dayPct;
      const width = (dayOf(e) - dayOf(s) + 1) * dayPct;
      if (width <= 0) return;
      const isPast = v.end < today, isOv = overlaps[v.id];
      const days = daysBetween(v.start, v.end);
      const label = width > 4 ? `${days} дн.` : '';
      const cls = isPast ? 'gantt-bar past-bar' : (isOv ? 'gantt-overlap-seg' : 'gantt-bar');
      bars += `<div class="${cls}" style="left:${left}%;width:${width}%" onclick="showInfo('${v.id}')">${label}</div>`;
    });
    rows += `<div class="gantt-row" data-name="${esc(name.toLowerCase())}">
        <div class="gantt-name">
          <input type="checkbox" class="cmp-chk" title="Добавить в сравнение" ${isInCompare?'checked':''} onchange="toggleCompare('${dep.id}','${nA}')">

          </div>
        </div>
        <div class="gantt-track">${gridBg}${todayLine}${bars}</div>
      </div>`;
  });
  if (!rows && !hidePast) rows = `<div class="empty">Нет сотрудников.${isAdmin ? ' Добавьте первый отпуск ниже.' : ''}</div>`;
  else if (!rows && hidePast) rows = `<div class="empty">Все отпуска завершены. Нажмите «Показать прошедшие».</div>`;
  const yearOpts = years.map(y => `<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('');
  const isFirst  = idx === 0, isLast = idx === departments.length - 1;
  const empCount = [...new Set(deptVacs.map(v => v.name))].length;
  return `<div class="dept-block ${collapsed?'collapsed':''}" id="dept-${dep.id}">
      <div class="dept-header" onclick="toggleDept('${dep.id}')">
        <svg class="icon dept-chevron"><use href="#i-chevron"/></svg>

        <span class="dept-meta">${empCount} чел.</span>
        <div class="dept-controls admin-only" onclick="event.stopPropagation()">
          <button class="move-btn" title="Вверх" ${isFirst?'disabled':''} onclick="moveDept('${dep.id}',-1)"><svg class="icon-sm"><use href="#i-up"/></svg></button>

          <button class="dept-ctrl-btn dept-del-btn" title="Удалить отдел" onclick="deleteDept('${dep.id}')"><svg class="icon-sm"><use href="#i-trash"/></svg></button>

            <div class="year-toggle-group">
              <select class="year-select" onchange="onYearChange('${dep.id}',this.value)">${yearOpts}</select>
              <button class="past-toggle-btn past-toggle-sm ${hidePast?'active':''}" onclick="togglePastDept('${dep.id}')">
              <svg class="icon-sm"><use href="#i-eye${hidePast?'-off':''}"/></svg>
              ${hidePast?'Показать прошедшие':'Скрыть прошедшие'}

function renderCompareGlobal() {
  const cont = document.getElementById('compareContainer');
  const keys = [...compareSelected];
  if (keys.length < 2) { cont.innerHTML = ''; return; }
  const today = todayStr();
  let selVacs = [];
  keys.forEach(k => {
    const [deptId, name] = k.split('::');
    vacations.filter(v => v.dept === deptId && v.name === name).forEach(v => selVacs.push(v));
  });
  if (hidePastCompare) selVacs = selVacs.filter(v => v.end >= today);
  if (!selVacs.length) {
    cont.innerHTML = `<div class="compare-global"><div class="card"><h3><svg class="icon"><use href="#i-chart"/></svg> Сравнение</h3><div class="empty">Нет данных для отображения.</div></div></div>`;
    return;
  }
  const yearsAvail = [...new Set(selVacs.flatMap(v => {
    const arr=[]; for(let y=parseInt(v.start.split('-')[0]);y<=parseInt(v.end.split('-')[0]);y++)arr.push(y); return arr;
  }))].sort();
  if (compareYear === null || !yearsAvail.includes(compareYear)) compareYear = yearsAvail.includes(new Date().getFullYear()) ? new Date().getFullYear() : yearsAvail[yearsAvail.length-1];
  const year = compareYear;
  const yearVacs = selVacs.filter(v => parseInt(v.start.split('-')[0])===year || parseInt(v.end.split('-')[0])===year);
  const employees = keys.map(k => { const [deptId,name]=k.split('::'); return {deptId,name,key:k}; })
    .filter(e => yearVacs.some(v => v.dept===e.deptId && v.name===e.name));
  const { rangeStart, rangeEnd } = calcRange(year, yearVacs, hidePastCompare);
  const totalDays = Math.round((rangeEnd-rangeStart)/86400000)+1;
  const dayPct = 100/totalDays;
  const dayOf = dt => Math.round((dt-rangeStart)/86400000);
  const MONTHS=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  let monthHeader='';
  for(let m=0;m<12;m++){
    const md=new Date(year,m,1),mde=new Date(year,m+1,0);
    if(mde<rangeStart||md>rangeEnd)continue;
    const vs=md<rangeStart?rangeStart:md, ve=mde>rangeEnd?rangeEnd:mde;
    monthHeader+=`<div class="gantt-month" style="left:${dayOf(vs)*dayPct}%;width:${(Math.round((ve-vs)/86400000)+1)*dayPct}%">${MONTHS[m]}</div>`;
  }
  let gridBg='';
  for(let m=0;m<12;m++){const md=new Date(year,m,1);if(md<=rangeStart||md>rangeEnd)continue;gridBg+=`<div class="gantt-grid" style="left:${dayOf(md)*dayPct}%"></div>`;}
  for(let d=0;d<totalDays;d++){const dt=new Date(rangeStart.getTime());dt.setDate(dt.getDate()+d);const wd=dt.getDay();if(wd===0||wd===6)gridBg+=`<div class="gantt-weekend" style="left:${d*dayPct}%;width:${dayPct}%"></div>`;}
  const todayDt=new Date();todayDt.setHours(0,0,0,0);
  let todayLine='';
  if(todayDt>=rangeStart&&todayDt<=rangeEnd)todayLine=`<div class="gantt-today" style="left:${dayOf(todayDt)*dayPct}%"></div>`;
  const {overlaps}=calcOverlaps(yearVacs);
  let rows='';
  employees.forEach(e=>{
    const dep=departments.find(d=>d.id===e.deptId);
    const label=`${e.name} · ${dep?dep.name:'?'}`;
    let bars='';
    yearVacs.filter(v=>v.dept===e.deptId&&v.name===e.name).forEach(v=>{
      let s=parseD(v.start),en=parseD(v.end);
      if(s<rangeStart)s=rangeStart; if(en>rangeEnd)en=rangeEnd;
      if(s>rangeEnd||en<rangeStart)return;
      const left=dayOf(s)*dayPct, width=(dayOf(en)-dayOf(s)+1)*dayPct;
      if(width<=0)return;
      const isPast=v.end<today,isOv=overlaps[v.id];
      const days=daysBetween(v.start,v.end);
      const cls=isPast?'gantt-bar past-bar':(isOv?'gantt-overlap-seg':'gantt-bar');
      bars+=`<div class="${cls}" style="left:${left}%;width:${width}%" onclick="showInfo('${v.id}')">${width>4?days+' дн.':''}</div>`;
    });
    rows+=`<div class="gantt-row"><div class="gantt-name"><span class="gantt-name-text" title="${esc(label)}">${esc(label)}</span></div><div class="gantt-track">${gridBg}${todayLine}${bars}</div></div>`;
  });
  const yearOpts=yearsAvail.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('');
  cont.innerHTML=`<div class="compare-global"><div class="card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
      <h3 style="margin:0;"><svg class="icon"><use href="#i-chart"/></svg> Сравнение (${employees.length})</h3>
      <div class="year-toggle-group">
        <select class="year-select" onchange="onCompareYearChange(this.value)">${yearOpts}</select>
        <button class="past-toggle-btn past-toggle-sm ${hidePastCompare?'active':''}" onclick="toggleComparePast()">
          <svg class="icon-sm"><use href="#i-eye${hidePastCompare?'-off':''}"/></svg>
          ${hidePastCompare?'Показать прошедшие':'Скрыть прошедшие'}
        </button>
      </div>
      <button class="btn-secondary" style="margin-left:auto;" onclick="clearCompare()">Очистить</button>
    </div>
    <div class="scroll-hint">← прокрутите вправо →</div>
    <div class="timeline-wrap"><div class="gantt">
      <div class="gantt-header"><div class="gantt-name-col">Сотрудник · Отдел</div><div class="gantt-months">${monthHeader}</div></div>
      ${rows}
    </div></div>
  </div></div>`;
}

const DP_MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function buildDatePicker(inp){
  const wrap=document.createElement('div');wrap.className='dp-field';
  inp.parentNode.insertBefore(wrap,inp);wrap.appendChild(inp);
  const disp=document.createElement('input');disp.type='text';disp.readOnly=true;disp.placeholder='дд.мм.гггг';
  disp.className=inp.className;wrap.appendChild(disp);
  inp.style.display='none';
  const ico=document.createElementNS('http://www.w3.org/2000/svg','svg');ico.setAttribute('class','dp-ico');ico.innerHTML='<use href="#i-calendar"/>';wrap.appendChild(ico);
  const pop=document.createElement('div');pop.className='dp-pop';wrap.appendChild(pop);
  let view=new Date();view.setDate(1);
  function sync(){
    if(inp.value){const d=parseD(inp.value);disp.value=d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});view=new Date(d.getFullYear(),d.getMonth(),1);}
    else disp.value='';
  }
  inp._dpSync=sync; sync();
  function draw(){
    const y=view.getFullYear(),m=view.getMonth();
    const sel=inp.value?parseD(inp.value):null;
    const today=todayStr();
    let html=`<div class="dp-head">
      <div class="dp-my">
        <button type="button" class="dp-mbtn">${DP_MONTHS[m]}</button>
        <button type="button" class="dp-ybtn">${y}</button>
        <div class="dp-select-pop months"></div>
        <div class="dp-select-pop years"></div>
      </div>
      <div class="dp-nav">
        <button type="button" class="dp-prev"><svg class="icon-sm" style="transform:rotate(90deg)"><use href="#i-chevron"/></svg></button>
        <button type="button" class="dp-next"><svg class="icon-sm" style="transform:rotate(-90deg)"><use href="#i-chevron"/></svg></button>
      </div>
    </div><div class="dp-grid">`;
    html+=DP_DOW.map((d,i)=>`<div class="dp-dow ${i>=5?'we':''}">${d}</div>`).join('');
    const first=new Date(y,m,1);let sd=first.getDay();sd=sd===0?6:sd-1;
    const dim=new Date(y,m+1,0).getDate();
    const prevDim=new Date(y,m,0).getDate();
    for(let i=sd-1;i>=0;i--)html+=`<div class="dp-day other">${prevDim-i}</div>`;
    for(let d=1;d<=dim;d++){
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dow=new Date(y,m,d).getDay();const we=(dow===0||dow===6);
      let cls='dp-day';if(we)cls+=' we';if(ds===today)cls+=' today';
      if(sel&&ds===inp.value)cls+=' selected';
      html+=`<div class="${cls}" data-d="${ds}">${d}</div>`;
    }
    const totalCells=sd+dim;const trail=(7-(totalCells%7))%7;
    for(let d=1;d<=trail;d++)html+=`<div class="dp-day other">${d}</div>`;
    html+=`</div><div class="dp-foot">
      <button type="button" class="dp-today">Сегодня</button>
      <button type="button" class="dp-clear">Очистить</button>
    </div>`;
    pop.innerHTML=html;
    pop.querySelector('.dp-prev').onclick=e=>{e.stopPropagation();view.setMonth(view.getMonth()-1);draw();};
    pop.querySelector('.dp-next').onclick=e=>{e.stopPropagation();view.setMonth(view.getMonth()+1);draw();};
    pop.querySelectorAll('.dp-day[data-d]').forEach(el=>el.onclick=e=>{e.stopPropagation();inp.value=el.getAttribute('data-d');sync();inp.dispatchEvent(new Event('change'));close();});
    pop.querySelector('.dp-today').onclick=e=>{e.stopPropagation();inp.value=today;sync();inp.dispatchEvent(new Event('change'));close();};
    pop.querySelector('.dp-clear').onclick=e=>{e.stopPropagation();inp.value='';sync();inp.dispatchEvent(new Event('change'));close();};
    const mPop=pop.querySelector('.dp-select-pop.months');
    const yPop=pop.querySelector('.dp-select-pop.years');
    mPop.innerHTML=DP_MONTHS.map((mn,i)=>`<button type="button" class="${i===m?'active':''}" data-m="${i}">${mn.slice(0,3)}</button>`).join('');
    const yNow=view.getFullYear();let yh='';
    for(let yy=yNow-6;yy<=yNow+6;yy++)yh+=`<button type="button" class="${yy===y?'active':''}" data-y="${yy}">${yy}</button>`;
    yPop.innerHTML=yh;
    pop.querySelector('.dp-mbtn').onclick=e=>{e.stopPropagation();yPop.classList.remove('open');mPop.classList.toggle('open');};
    pop.querySelector('.dp-ybtn').onclick=e=>{e.stopPropagation();mPop.classList.remove('open');yPop.classList.toggle('open');const a=yPop.querySelector('.active');if(a)a.scrollIntoView({block:'center'});};
    mPop.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();view.setMonth(parseInt(b.dataset.m));draw();});
    yPop.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();view.setFullYear(parseInt(b.dataset.y));draw();});
  }
  function open(){
    if(dpActive&&dpActive!==close)dpActive();
    draw();pop.classList.add('open');
    const rect=pop.getBoundingClientRect();
    if(rect.bottom>window.innerHeight&&rect.top>rect.height)pop.classList.add('up');else pop.classList.remove('up');
    dpActive=close;
    setTimeout(()=>document.addEventListener('click',outside,true),30);
  }
  function close(){pop.classList.remove('open','up');document.removeEventListener('click',outside,true);if(dpActive===close)dpActive=null;}
  function outside(e){if(!wrap.contains(e.target))close();}
  disp.onclick=e=>{e.stopPropagation();if(pop.classList.contains('open'))close();else open();};
}

/* инициализация picker'ов в статичных модалках */
enhanceAllDates();
</script>
